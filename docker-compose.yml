services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      target: api
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: ${DATABASE_URL:-postgres://apeiro:apeiro@postgres:5432/apeiro}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # SMTP (Hostinger) credentials come from .env — dev uses the console
      # backend, but the vars are passed through so production settings work.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_REGION: ${AWS_STORAGE_REGION:-us-east-1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apeiro}
      POSTGRES_USER: ${POSTGRES_USER:-apeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apeiro}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible object storage for artifact production use and
    # self-hosted environments. Disabled by default: set
    # ARTIFACT_STORAGE=s3 + AWS_* vars to use it.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apeiro-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-me-min-8-chars}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  

  # HTTP/content checks + notification delivery (API image, no Chromium).
  celery-http-worker:
    build:
      context: ./backend
      target: api
    command: celery -A config worker --loglevel=info --queues=celery_http,celery_notifications --concurrency=${HTTP_WORKER_CONCURRENCY:-4} --prefetch-multiplier=${CELERY_TASK_PREFETCH_MULTIPLIER:-1}
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: ${DATABASE_URL:-postgres://apeiro:apeiro@postgres:5432/apeiro}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # SMTP (Hostinger) credentials come from .env; the worker sends mail.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@example.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_REGION: ${AWS_STORAGE_REGION:-us-east-1}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Playwright checks only (browser image with Chromium). Concurrency 1:
  # one Chromium per prefork child is the isolation model (BROWSER-WORKER.md).
  celery-browser-worker:
    build:
      context: ./backend
      target: browser
    command: celery -A config worker --loglevel=info --queues=celery_browser --concurrency=${BROWSER_WORKER_CONCURRENCY:-1} --prefetch-multiplier=1 --max-tasks-per-child=${BROWSER_MAX_TASKS_PER_CHILD:-50}
    init: true
    stop_grace_period: 180s
    environment:
      <<: *backend-environment
      # The ONLY service allowed to import the Playwright task module.
      CELERY_IMPORTS: monitors.advanced_tasks
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      target: api
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_next:
  postgres_data:
  redis_data:
  minio_data:
